<head>

<style>
  html{background:#f1f5f9}html.dark{background:#0b1220}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;margin:0}
  .scroll{scrollbar-width:thin}.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}.dark .scroll::-webkit-scrollbar-thumb{background:#475569}
  .tab{padding:8px 4px;font-size:14px;font-weight:600;color:#64748b;cursor:pointer;border-bottom:2px solid transparent}
  .tab[data-active="1"]{color:#ff3c6f;border-bottom-color:#ff3c6f}.dark .tab{color:#94a3b8}
  .switch{width:42px;height:24px;border-radius:999px;background:#cbd5e1;position:relative;cursor:pointer;transition:background .15s;flex-shrink:0}
  .switch[data-on="1"]{background:#ff3c6f}
  .switch::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
  .switch[data-on="1"]::after{left:21px}
  .dark .switch{background:#374151}
  .var-chip{font-size:11px;font-family:ui-monospace,monospace;background:#fdf2f8;color:#ff3c6f;border:1px solid #fbcfe8;border-radius:6px;padding:2px 6px;cursor:pointer}
  .dark .var-chip{background:#3f1d2b;color:#f9a8d4;border-color:#6d2647}
  [data-fade]{animation:fade .18s ease}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>

<!-- ===== Tema Dra. Charm: Poppins + cards foscos flutuando (mantém o fundo existente) ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="dc-theme">
  body{font-family:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  /* cards "flutuando": fosco/translúcido + sombra cinza suave (não altera o fundo) */
  .rounded-2xl.border.bg-white{
    background:rgba(255,255,255,.85);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    box-shadow:0 1px 3px rgba(15,23,42,.08);
    border-color:rgba(226,232,240,.9);
  }
  html.dark .rounded-2xl.border.dark\:bg-ink-800{
    background:rgba(17,24,39,.72);
    box-shadow:0 16px 40px rgba(0,0,0,.5), 0 3px 10px rgba(0,0,0,.35);
    border-color:rgba(255,255,255,.08);
  }
  /* leve 3D nos cards clicáveis ao passar o mouse */
  button.rounded-2xl.border.bg-white, a.rounded-2xl.border.bg-white{transition:transform .16s ease, box-shadow .16s ease}
  button.rounded-2xl.border.bg-white:hover, a.rounded-2xl.border.bg-white:hover{box-shadow:0 4px 12px rgba(15,23,42,.10)}
</style>
<script id="dc-fav-std">(function(){try{document.querySelectorAll('link[rel="icon"],link[rel="shortcut icon"]').forEach(function(l){l.remove();});var l=document.createElement('link');l.rel='icon';l.type='image/png';l.href='https://wwytzoyeibekhstinott.supabase.co/storage/v1/object/public/system-assets/favicon.png';document.head.appendChild(l);}catch(e){}})();</script>
</head>
<body class="text-slate-800 dark:text-slate-100">

<div id="authGate" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-50 dark:bg-ink-900">
  <div class="text-center">
    <div class="w-14 h-14 mx-auto rounded-2xl overflow-hidden mb-4"><img src="/icone-app.png" alt="Aragão" class="w-full h-full object-cover"></div>
    <div class="font-semibold mb-1">Automações</div><div class="text-sm text-slate-500 mb-4">Faça login na Suíte para acessar.</div>
    <a href="/" class="inline-block text-sm font-semibold text-white bg-pink-500 hover:bg-pink-600 px-4 py-2 rounded-lg">Ir para o login</a>
  </div>
</div>

<div id="appWrap" class="hidden">
<header class="h-14 flex items-center justify-between px-4 bg-white/95 dark:bg-ink-800/95 border-b border-slate-200 dark:border-ink-600 sticky top-0 z-30 backdrop-blur">
  <div class="flex items-center gap-3">
    <button onclick="location.href='/'" title="Voltar à Suíte" class="w-9 h-9 rounded-xl shadow hover:scale-105 hover:shadow-md transition flex items-center justify-center text-white bg-gradient-to-br from-rose-500 to-pink-600"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M3 9h18M9 20v-6h6v6"/></svg></button>
    <div class="leading-tight"><div class="text-sm font-semibold">Lojas</div><div class="text-[11px] text-slate-500 dark:text-slate-400">Integrações de loja · Grupo Aragão</div></div>
  </div>
  <div class="flex items-center gap-1">
    <button onclick="location.href='/'" class="w-9 h-9 rounded-lg hover:bg-slate-100 dark:hover:bg-ink-700 hover:text-pink-500 flex items-center justify-center text-slate-500" title="Voltar"><img src="/icone-app.png" alt="Suíte" class="w-6 h-6 rounded-md object-cover"></button>
    <button onclick="document.documentElement.classList.toggle('dark')" class="w-9 h-9 rounded-lg hover:bg-slate-100 dark:hover:bg-ink-700 hover:text-pink-500 flex items-center justify-center text-slate-500" title="Tema"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
  </div>
</header>

<div class="p-4 max-w-6xl mx-auto space-y-4">

  <!-- Mesmo cabeçalho, mesmos cards de loja e MESMA barra de abas do /lojas.html.
       Gatilhos e Fila de envios moram aqui; as outras abas voltam pro painel. Assim a
       página "monta" igual, clicando em qualquer aba. -->
  <div id="chips" class="flex gap-3 flex-wrap"></div>
  <div id="abas" class="flex gap-1 flex-wrap border-b border-slate-200 dark:border-ink-600 pb-px"></div>

  <!-- Gatilhos -->
  <div id="viewGatilhos">
    <p class="text-sm text-slate-500 dark:text-slate-400 mb-3">Ative os eventos que devem avisar o cliente.</p>
    <div id="webhookBox" class="hidden mb-4"></div>
    <div id="gatilhosList" class="space-y-6 pb-10"></div>
  </div>

  <!-- Fila de envios — desenhada no formato do Notificações Inteligentes:
       cartões de visão geral em cima, tabela com filtro embaixo, tudo DA LOJA escolhida. -->
  <div id="viewFila" class="hidden pb-10">
    <div class="rounded-xl border border-slate-200 dark:border-ink-600 bg-white dark:bg-ink-800 p-4 mb-4">
      <div class="text-sm font-semibold mb-0.5">Visão geral da fila</div>
      <p class="text-[13px] text-slate-500 dark:text-slate-400 mb-3">Envios de <b id="filaLojaNome">—</b> nas últimas 24 horas.</p>
      <div id="filaCards" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2"></div>
    </div>

    <div class="rounded-xl border border-slate-200 dark:border-ink-600 bg-white dark:bg-ink-800 overflow-hidden">
      <div class="p-4 border-b border-slate-100 dark:border-ink-700">
        <p class="text-[13px] text-slate-500 dark:text-slate-400 mb-3">Cada linha é um evento da loja que passou por um gatilho.</p>
        <div class="flex flex-wrap items-end gap-2">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Estado</label>
            <select id="filaFiltro" onchange="renderFila()" class="p-2 text-sm rounded-lg bg-white dark:bg-ink-700 border border-slate-200 dark:border-ink-600">
              <option value="">Todos</option>
              <option value="enviado">Enviado</option>
              <option value="erro">Erro</option>
              <option value="ignorado">Ignorado</option>
              <option value="aguardando_modelo">Aguardando modelo</option>
              <option value="simulado">Simulado (modo seco)</option>
            </select>
          </div>
          <div class="flex-1 min-w-[160px]">
            <label class="block text-[11px] text-slate-400 mb-1">Buscar</label>
            <input id="filaBusca" oninput="renderFila()" placeholder="Pedido, telefone ou evento" class="w-full p-2 text-sm rounded-lg bg-white dark:bg-ink-700 border border-slate-200 dark:border-ink-600">
          </div>
          <button onclick="carregarFila()" class="text-sm px-3 py-2 rounded-lg bg-slate-100 dark:bg-ink-700 hover:bg-slate-200">Atualizar</button>
        </div>
      </div>
      <div id="filaList" class="overflow-x-auto"></div>
    </div>
  </div>
</div>
</div>

<script>
const SUPA = { url:'https://wwytzoyeibekhstinott.supabase.co', key:'sb_publishable_uMoCEK4Ed_u8ZIfjVZ7Jrg_tdR4b9bO' };
const VARS = ['{{nome}}','{{pedido}}','{{produto}}','{{codigo_rastreio}}','{{valor}}','{{loja}}'];
const LOJAS = [
  { key:'loja_integrada', nome:'Loja Integrada', desc:'Pedidos, pagamento, envio e entrega', logo:'/img/loja-integrada.svg' },
  { key:'troquecommerce', nome:'TroqueCommerce', desc:'Trocas, devoluções, vale e estorno',  logo:'/img/troquecommerce.png' },
  { key:'fidelizar',      nome:'Fidelizar',      desc:'Pontos, cupons e aniversário',        logo:'/img/fidelizar.svg' }
];
let sb=null, GATILHOS=[], FILA=[], TAB='gatilhos', FILA_SEM_LOJA=false;
let TPLS=[], WHK=null, TOKEN=null;
let LOJA = (function(){ try{ return localStorage.getItem('autom_loja') || 'loja_integrada'; }catch(e){ return 'loja_integrada'; } })();
async function getSb(){ if(!sb){ const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2'); sb=createClient(SUPA.url,SUPA.key,{auth:{persistSession:true,autoRefreshToken:true}}); } return sb; }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x])); }

async function bootstrap(){
  const c=await getSb(); const { data:{ session } }=await c.auth.getSession();
  if(!session){ document.getElementById('authGate').classList.remove('hidden'); return; }
  TOKEN = session.access_token;
  document.getElementById('appWrap').classList.remove('hidden');
  renderAbas();
  await carregarGatilhos(); await carregarFila();
  carregarTemplates(); carregarWebhook();
  // realtime na fila
  c.channel('automacoes').on('postgres_changes',{event:'*',schema:'public',table:'at_disparos_log'},()=>carregarFila()).subscribe();
}

async function carregarGatilhos(){
  const c=await getSb();
  const { data, error }=await c.from('at_gatilhos').select('*').order('loja').order('categoria').order('ordem');
  if(error){ console.error(error); return; }
  GATILHOS=data||[]; renderLojas(); renderGatilhos();
}
async function carregarTemplates(){
  try{
    const r=await fetch('/api/whatsapp-templates',{headers:{Authorization:'Bearer '+TOKEN}});
    const j=await r.json(); TPLS=j.templates||[];
  }catch(e){ TPLS=[]; }
  renderGatilhos();
}

async function carregarWebhook(){
  try{
    const r=await fetch('/api/li-webhook?config=1',{headers:{Authorization:'Bearer '+TOKEN}});
    WHK=await r.json();
  }catch(e){ WHK=null; }
  renderWebhook();
}

function renderWebhook(){
  const el=document.getElementById('webhookBox'); if(!el) return;
  if(LOJA!=='loja_integrada' || !WHK){ el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  const nm=(WHK.naoMapeados||[]);
  const ult=(WHK.recentes||[])[0];
  el.innerHTML = `<div class="rounded-xl border border-slate-200 dark:border-ink-600 bg-white dark:bg-ink-800 p-4 space-y-3">
    <div class="flex items-center gap-2 flex-wrap">
      <span class="text-sm font-semibold">Recebimento da Loja Integrada</span>
      ${WHK.configurado
        ? '<span class="text-[11px] px-2 py-0.5 rounded-full font-semibold bg-emerald-100 text-emerald-700">endereço pronto</span>'
        : '<span class="text-[11px] px-2 py-0.5 rounded-full font-semibold bg-amber-100 text-amber-700">falta o segredo no Vercel</span>'}
      ${WHK.modo_seco
        ? '<span class="text-[11px] px-2 py-0.5 rounded-full font-semibold bg-amber-100 text-amber-700">envios pausados</span>'
        : '<span class="text-[11px] px-2 py-0.5 rounded-full font-semibold bg-emerald-100 text-emerald-700">enviando</span>'}
      ${WHK.wa_ok ? '' : '<span class="text-[11px] px-2 py-0.5 rounded-full font-semibold bg-rose-100 text-rose-700">WhatsApp não configurado</span>'}
    </div>
    ${WHK.url ? `<div>
      <div class="text-[12px] text-slate-500 dark:text-slate-400 mb-1">Cole este endereço no webhook da Loja Integrada:</div>
      <div class="flex gap-2">
        <input readonly id="whkUrl" value="${esc(WHK.url)}" class="flex-1 min-w-0 p-2 text-[12px] font-mono rounded-lg bg-slate-50 dark:bg-ink-700 border border-slate-200 dark:border-ink-600">
        <button onclick="copiarWhk()" class="text-sm font-semibold px-3 py-2 rounded-lg bg-slate-100 dark:bg-ink-700 hover:bg-slate-200 shrink-0">Copiar</button>
      </div></div>` : `<div class="text-[12px] text-slate-500">Cadastre <b>LI_WEBHOOK_TOKEN</b> nas variáveis do Vercel pra gerar o endereço.</div>`}
    ${WHK.modo_seco ? '<div class="rounded-lg p-3 bg-amber-50 dark:bg-amber-900/20 text-[12px] text-amber-800 dark:text-amber-300"><b>Os envios estão pausados.</b> Os eventos continuam chegando e ficam registrados, mas o cliente não recebe nada.</div>' : ''}
    <div class="text-[12px] text-slate-500 dark:text-slate-400">
      ${ult ? ('Último evento recebido: <b>'+esc(ult.evento_label||ult.evento_codigo)+'</b>'+(ult.pedido?(' · pedido '+esc(ult.pedido)):'')+' · '+new Date(ult.created_at).toLocaleString('pt-BR'))
            : 'Nenhum evento recebido ainda.'}
      · <button onclick="carregarWebhook()" class="underline hover:text-pink-600">atualizar</button>
      · <button onclick="virarModo()" class="underline hover:text-pink-600">${WHK.modo_seco ? 'retomar envios' : 'pausar envios'}</button>
    </div>
    ${nm.length ? `<div class="text-[12px] rounded-lg px-2.5 py-2 bg-amber-50 text-amber-700 dark:bg-amber-900/30 dark:text-amber-300">
        <b>A loja mandou situações que nenhum gatilho conhece:</b> ${nm.map(esc).join(', ')}. Me avise que eu ligo cada uma no gatilho certo.</div>` : ''}
  </div>`;
}
async function virarModo(){
  const ligando = WHK && WHK.modo_seco;
  const msg = ligando
    ? 'Retomar os envios?\n\nA partir de agora cada mudança de status manda WhatsApp pro cliente.\n\nSó confirme se você JÁ desligou os gatilhos no Notificações Inteligentes — senão o cliente recebe duas vezes.'
    : 'Pausar os envios? Os eventos continuam chegando e ficam registrados, mas o cliente para de receber.';
  if(!confirm(msg)) return;
  try{
    const r=await fetch('/api/li-webhook?seco='+(ligando?'0':'1'),{method:'POST',headers:{Authorization:'Bearer '+TOKEN}});
    const j=await r.json();
    if(!r.ok){ alert(j.error||'Não deu pra mudar'); return; }
    await carregarWebhook();
    alert(j.modo_seco ? 'Envios pausados.' : 'Envios retomados.');
  }catch(e){ alert('Erro: '+e.message); }
}
function copiarWhk(){ const i=document.getElementById('whkUrl'); i.select(); document.execCommand('copy'); alert('Endereço copiado.'); }

function tplDe(nome){ return TPLS.find(t=>t.name===nome)||null; }

function blocoTemplate(g){
  const t=tplDe(g.template_name);
  const nVars=t?t.vars:0;
  // se o gatilho ainda não tem mapa, usa o que foi escolhido na criação do modelo
  let mapa=Array.isArray(g.template_mapa)?g.template_mapa:[];
  const salvo = (WHK && WHK.tplMapas && g.template_name) ? WHK.tplMapas[g.template_name] : null;
  if((!mapa || !mapa.length) && Array.isArray(salvo) && salvo.length) mapa = salvo;
  // as variáveis vêm do PRÓPRIO webhook da loja (último evento recebido),
  // com o mesmo nome que aparece lá — assim dá pra conferir na fonte.
  const VARS_WHK = (WHK && Array.isArray(WHK.variaveis) && WHK.variaveis.length) ? WHK.variaveis : null;
  const CAMPOS = VARS_WHK
    ? VARS_WHK.map(v=>[v.caminho, v.rotulo + (v.exemplo!==undefined && v.caminho!=='aviso' ? ('  —  ex.: '+v.exemplo) : '')])
    : [['cliente.nome','Nome do cliente'],['numero','Número do pedido'],['envios.0.objeto','Código de rastreio'],['valor_total','Valor total'],['aviso','Frase fixa (a mesma pra todos)']];
  let vars='';
  if(t && nVars>0){
    const veioDaCriacao = (!Array.isArray(g.template_mapa)||!g.template_mapa.length) && Array.isArray(salvo) && salvo.length;
    vars='<div class="mt-3"><div class="text-[12px] font-semibold text-slate-600 dark:text-slate-300 mb-1">O que entra em cada espaço da mensagem'
      + (veioDaCriacao?' <span class="text-[11px] font-normal text-emerald-600">— já preenchido com o que você escolheu ao criar o modelo</span>':'')
      + '</div><div class="space-y-1.5">'+Array.from({length:nVars},(_,i)=>
      `<div class="flex items-center gap-2"><span class="var-chip shrink-0">{{${i+1}}}</span>
       <select id="mp_${g.id}_${i}" class="flex-1 min-w-0 p-1.5 text-[13px] rounded-lg bg-slate-50 dark:bg-ink-700 border border-slate-200 dark:border-ink-600">
       ${CAMPOS.map(c=>`<option value="${esc(c[0])}"${mapa[i]===c[0]?' selected':''}>${esc(c[1])}</option>`).join('')}
       </select></div>`).join('')+'</div>'
      + (VARS_WHK ? '<div class="text-[11px] text-slate-400 mt-1.5">'+VARS_WHK.length+' variáveis disponíveis, lidas do último evento que a loja mandou. O nome é o mesmo que sai no webhook — se faltar alguma, é porque aquele pedido não trazia esse campo.</div>' : '')
      + '</div>';
  }
  return `<div class="mt-3 pt-3 border-t border-slate-100 dark:border-ink-700">
    <div class="text-[12px] font-semibold text-slate-600 dark:text-slate-300 mb-1">Modelo aprovado que será enviado</div>
    <select id="tp_${g.id}" onchange="trocouTpl('${g.id}')" class="w-full p-2 text-sm rounded-lg bg-slate-50 dark:bg-ink-700 border border-slate-200 dark:border-ink-600">
      <option value="">— escolher um modelo aprovado —</option>
      ${TPLS.map(t2=>`<option value="${esc(t2.name)}"${g.template_name===t2.name?' selected':''}>${esc(t2.name)}${t2.vars?(' — '+t2.vars+' campo'+(t2.vars>1?'s':'')+' a preencher'):' — sem campos'}</option>`).join('')}
    </select>
    ${t?`<div class="text-[12px] text-slate-500 dark:text-slate-400 mt-1.5 whitespace-pre-wrap">${esc(t.body||'')}</div>`:''}
    ${vars}
    <div class="text-[11px] text-slate-400 mt-2">É este modelo que o cliente recebe. O WhatsApp oficial só entrega modelo aprovado pela Meta fora da janela de 24h — não dá pra escrever texto livre aqui. Pra mudar o texto, crie um modelo novo em WhatsApp Oficial → Templates.</div>
  </div>`;
}
function trocouTpl(id){ const g=GATILHOS.find(x=>x.id===id); if(!g) return; g.template_name=document.getElementById('tp_'+id).value||null; g.template_mapa=[]; renderGatilhos(); document.getElementById('ed_'+id).classList.remove('hidden'); }

// mesmo cartao de loja da tela de Lojas, pro sistema ter uma cara so
function marcaLoja(l, tam){
  const r = tam >= 40 ? 'rounded-xl' : 'rounded-lg';
  const p = tam >= 40 ? 'p-1.5' : 'p-1';
  return '<div class="'+r+' bg-white border border-slate-200 dark:border-ink-600 '+p
    + ' flex items-center justify-center shrink-0" style="width:'+tam+'px;height:'+tam+'px">'
    + '<img src="'+l.logo+'" alt="'+esc(l.nome)+'" class="w-full h-full object-contain" loading="lazy">'
    + '</div>';
}

function renderLojas(){
  const el=document.getElementById('chips'); if(!el) return;
  el.innerHTML=LOJAS.map(l=>{
    const meus=GATILHOS.filter(g=>(g.loja||'loja_integrada')===l.key);
    const on=meus.filter(g=>g.ativo).length;
    const sel=LOJA===l.key;
    return '<button onclick="trocarLoja(\''+l.key+'\')" class="flex items-center gap-3 px-4 py-3 rounded-2xl border transition text-left '
      + (sel ? 'bg-white dark:bg-ink-800 border-pink-300 dark:border-pink-700 ring-2 ring-pink-200 dark:ring-pink-900/50 shadow-sm'
             : 'bg-white/60 dark:bg-ink-800/50 border-slate-200 dark:border-ink-600 hover:border-slate-300') + '">'
      + marcaLoja(l, 40)
      + '<div><div class="text-sm font-semibold '+(sel?'':'text-slate-500 dark:text-slate-400')+'">'+esc(l.nome)+'</div>'
      + '<div class="text-[11px] text-slate-400">'+esc(l.desc)+'</div></div>'
      + '<span class="ml-2 text-[11px] font-semibold px-2 py-0.5 rounded-full '
      + (sel ? 'bg-pink-100 text-pink-700 dark:bg-pink-900/40 dark:text-pink-200' : 'bg-slate-100 text-slate-500 dark:bg-ink-700 dark:text-slate-300')
      + '">'+on+'/'+meus.length+'</span>'
      + '</button>';
  }).join('');
}
function trocarLoja(k){ LOJA=k; try{ localStorage.setItem('autom_loja',k); }catch(e){} renderLojas(); renderGatilhos(); renderWebhook(); carregarFila(); }

function renderGatilhos(){
  const cats={pedido:'Eventos do pedido', nota:'Eventos de nota fiscal', troca:'Eventos de troca', fidelizar:'Fidelidade', rastreio:'Rastreio da entrega', vale:'Vales e cupons', nps:'Pesquisa de satisfação'};
  const grupos={};
  GATILHOS.filter(g=>(g.loja||'loja_integrada')===LOJA).forEach(g=>{ (grupos[g.categoria]=grupos[g.categoria]||[]).push(g); });
  const el=document.getElementById('gatilhosList');
  if(!Object.keys(grupos).length){
    const l=LOJAS.find(x=>x.key===LOJA)||{nome:LOJA};
    el.innerHTML='<div class="rounded-xl border border-slate-200 dark:border-ink-600 bg-white dark:bg-ink-800 p-8 text-center text-sm text-slate-400">Nenhum gatilho cadastrado para <b>'+esc(l.nome)+'</b> ainda.</div>';
    return;
  }
  el.innerHTML=Object.keys(grupos).map(cat=>`
    <div>
      <div class="text-sm font-semibold text-slate-700 dark:text-slate-200 mb-2">${cats[cat]||cat}</div>
      <div class="rounded-xl border border-slate-200 dark:border-ink-600 divide-y divide-slate-100 dark:divide-ink-700 bg-white dark:bg-ink-800">
        ${grupos[cat].map(g=>gatilhoRow(g)).join('')}
      </div>
    </div>`).join('');
}
function gatilhoRow(g){
  return `<div class="p-3" data-fade>
    <div class="flex items-center gap-3">
      <div class="switch" data-on="${g.ativo?1:0}" onclick="toggleAtivo('${g.id}')"></div>
      <button onclick="toggleEditor('${g.id}')" class="flex-1 text-left text-sm font-medium">${esc(g.evento_nome)}</button>
      <button onclick="toggleEditor('${g.id}')" class="text-slate-400 hover:text-pink-600" title="Editar mensagem"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    </div>
    <div id="ed_${g.id}" class="hidden mt-3 pl-1">
      ${blocoTemplate(g)}
      <div class="flex items-center justify-between mt-3 gap-2 flex-wrap">
        <span class="text-[11px] text-slate-400">${g.li_codigo?('Situação na loja: <b>'+esc(g.li_codigo)+'</b>'):'<span class="text-amber-600">Ainda não sei qual situação da loja dispara este gatilho.</span>'}</span>
        <button onclick="salvarMsg('${g.id}')" class="text-sm font-semibold px-3 py-1.5 rounded-lg bg-pink-500 hover:bg-pink-600 text-white">Salvar</button>
      </div>
    </div>
  </div>`;
}
async function toggleAtivo(id){ const g=GATILHOS.find(x=>x.id===id); if(!g) return; g.ativo=!g.ativo;
  document.querySelector(`.switch[onclick="toggleAtivo('${id}')"]`).dataset.on=g.ativo?1:0;
  renderLojas();
  try{ await (await getSb()).from('at_gatilhos').update({ativo:g.ativo}).eq('id',id); }catch(e){ console.warn(e.message); } }
function toggleEditor(id){ document.getElementById('ed_'+id).classList.toggle('hidden'); }
function inserirVar(id,v){ const t=document.getElementById('msg_'+id); const s=t.selectionStart||t.value.length; t.value=t.value.slice(0,s)+v+t.value.slice(s); t.focus(); }
async function salvarMsg(id){ const g=GATILHOS.find(x=>x.id===id);
  const tpEl=document.getElementById('tp_'+id); const tp=tpEl?(tpEl.value||null):g.template_name;
  const t=tplDe(tp); const mapa=[];
  if(t) for(let i=0;i<t.vars;i++){ const e2=document.getElementById('mp_'+id+'_'+i); mapa.push(e2?e2.value:'nome'); }
  g.template_name=tp; g.template_mapa=mapa; g.mensagem = t? (t.body||'') : '';
  const btn=event.target; btn.textContent='Salvando…'; btn.disabled=true;
  try{ await (await getSb()).from('at_gatilhos').update({mensagem:g.mensagem,template_name:tp,template_mapa:mapa,updated_at:new Date().toISOString()}).eq('id',id); btn.textContent='Salvo'; }
  catch(e){ alert('Erro ao salvar: '+e.message); btn.textContent='Salvar'; } finally{ btn.disabled=false; setTimeout(()=>{btn.textContent='Salvar';},1500); } }

async function carregarFila(){
  // A leitura vai pelo /api/disparos-log: at_disparos_log tem RLS ligada e nenhuma
  // política, então ler direto do navegador devolve lista VAZIA sem erro nenhum — foi
  // exatamente o que aconteceu na primeira versão desta aba.
  try{
    const r = await fetch('/api/disparos-log?loja='+encodeURIComponent(LOJA)+'&limite=300', { headers:{ Authorization:'Bearer '+TOKEN } });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || ('erro '+r.status));
    FILA = j.itens || [];
    FILA_SEM_LOJA = !!j.semColuna;
  }catch(e){
    console.warn('fila:', e.message); FILA = [];
  }
  renderAbas();
  renderFila();
}

function nomeEvento(k){
  const g = GATILHOS.find(x => String(x.evento_code) === String(k) && x.loja === LOJA);
  return (g && g.evento_nome) || String(k||'—');
}
const FILA_ROTULO = { enviado:'Enviado', erro:'Erro', ignorado:'Ignorado', aguardando_modelo:'Aguardando modelo', simulado:'Simulado' };
function filaCor(s){
  return s==='enviado' ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300'
       : s==='erro'    ? 'bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300'
       : s==='ignorado'? 'bg-slate-200 text-slate-600 dark:bg-ink-600 dark:text-slate-300'
       : s==='simulado'? 'bg-sky-100 text-sky-700 dark:bg-sky-900/40 dark:text-sky-300'
       : 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300';
}
function cartao(rotulo, valor, classe){
  return '<div class="rounded-lg bg-slate-50 dark:bg-ink-700 p-3"><div class="text-[11px] text-slate-500 dark:text-slate-400 leading-tight">'+rotulo+'</div>'
       + '<div class="text-xl font-bold mt-0.5 '+(classe||'')+'">'+valor+'</div></div>';
}

function renderFila(){
  const lj = LOJAS.find(l=>l.key===LOJA);
  const nomeEl = document.getElementById('filaLojaNome');
  if(nomeEl) nomeEl.textContent = FILA_SEM_LOJA ? 'todas as lojas' : ((lj&&lj.nome)||LOJA);

  const desde = Date.now() - 24*3600*1000;
  const dia = FILA.filter(x => new Date(x.created_at).getTime() >= desde);
  const cnt = st => dia.filter(x => x.status===st).length;
  const cards = document.getElementById('filaCards');
  if(cards) cards.innerHTML =
      cartao('Total de eventos', dia.length, '')
    + cartao('Enviados', cnt('enviado'), 'text-emerald-600')
    + cartao('Erros', cnt('erro'), 'text-red-600')
    + cartao('Ignorados', cnt('ignorado'), 'text-slate-500')
    + cartao('Aguardando modelo', cnt('aguardando_modelo'), 'text-amber-600');

  const f=(document.getElementById('filaFiltro')||{}).value||'';
  const bq=((document.getElementById('filaBusca')||{}).value||'').toLowerCase().trim();
  const arr=FILA.filter(x=>(!f||x.status===f) && (!bq
    || String(x.pedido||'').toLowerCase().includes(bq)
    || String(x.telefone||'').toLowerCase().includes(bq)
    || nomeEvento(x.evento_key).toLowerCase().includes(bq)));

  const el=document.getElementById('filaList');
  if(!arr.length){ el.innerHTML='<div class="p-8 text-center text-sm text-slate-400">A fila de envios está vazia.</div>'; return; }
  el.innerHTML =
    '<table class="w-full text-sm"><thead><tr class="text-left text-[11px] uppercase tracking-wide text-slate-400 border-b border-slate-100 dark:border-ink-700">'
    + '<th class="px-4 py-2 font-semibold">Nome do evento</th><th class="px-4 py-2 font-semibold">Criado em</th>'
    + '<th class="px-4 py-2 font-semibold">Pedido</th><th class="px-4 py-2 font-semibold">Telefone de destino</th>'
    + '<th class="px-4 py-2 font-semibold">Estado</th></tr></thead><tbody>'
    + arr.map(x=>'<tr class="border-b border-slate-50 dark:border-ink-700/60 align-top">'
        + '<td class="px-4 py-2"><div class="font-medium">'+esc(nomeEvento(x.evento_key))+'</div>'
        + (x.detalhe?'<div class="text-[11px] text-slate-400 mt-0.5">'+esc(x.detalhe)+'</div>':'')+'</td>'
        + '<td class="px-4 py-2 whitespace-nowrap text-slate-500">'+new Date(x.created_at).toLocaleString('pt-BR')+'</td>'
        + '<td class="px-4 py-2 whitespace-nowrap">'+esc(x.pedido||'—')+'</td>'
        + '<td class="px-4 py-2 whitespace-nowrap">'+esc(x.telefone||'—')+'</td>'
        + '<td class="px-4 py-2 whitespace-nowrap"><span class="px-2 py-0.5 rounded-full text-[11px] font-semibold '+filaCor(x.status)+'">'
        + esc(FILA_ROTULO[x.status]||x.status||'—')+'</span></td></tr>').join('')
    + '</tbody></table>';
}

// A MESMA barra de abas do /lojas.html. Gatilhos e Fila são desta página; as outras
// levam de volta pro painel. O Marcio reclamou (duas vezes) que a página "montava
// diferente" ao clicar em Gatilhos/Fila — era porque aqui havia outro cabeçalho e só
// duas abas. Se mexer nas abas de lá, mexa aqui também.
const ABAS = [
  { key:'resumo',    nome:'Visão geral',    vaiPara:'/lojas.html#resumo' },
  { key:'gatilhos',  nome:'Gatilhos' },
  { key:'eventos',   nome:'Eventos',        vaiPara:'/lojas.html#eventos' },
  { key:'webhook',   nome:'Webhook',        vaiPara:'/lojas.html#webhook' },
  { key:'relatorio', nome:'Relatórios',     vaiPara:'/lojas.html#relatorio' },
  { key:'fila',      nome:'Fila de envios' },
  { key:'leads',     nome:'Lista de leads', vaiPara:'/lojas.html#leads' }
];
function irPara(a){
  if(a.vaiPara){ try{ localStorage.setItem('autom_loja',LOJA); }catch(e){} location.href=a.vaiPara; return; }
  setTab(a.key);
}
function renderAbas(){
  const el=document.getElementById('abas'); if(!el) return;
  el.innerHTML = ABAS.map(a=>{
    const on = a.key===TAB && !a.vaiPara;
    const pend = (FILA||[]).filter(x=>x.status==='aguardando_modelo' || x.status==='erro').length;
    const badge = (a.key==='fila' && pend) ? ' <span class="ml-0.5 text-[10px] bg-rose-100 text-rose-700 dark:bg-rose-900/40 dark:text-rose-300 rounded-full px-1.5 py-0.5 align-middle">'+pend+'</span>' : '';
    return '<button onclick=\'irPara('+JSON.stringify(a)+')\' class="px-3 py-2 text-[13px] font-semibold rounded-t-lg border-b-2 transition '
      + (on ? 'border-pink-500 text-pink-600 dark:text-pink-300'
            : 'border-transparent text-slate-500 hover:text-pink-600 dark:text-slate-400') + '">'
      + esc(a.nome) + badge + '</button>';
  }).join('');
}

function setTab(t){
  TAB=t;
  history.replaceState(null,'','#'+t);
  renderAbas();
  document.getElementById('viewGatilhos').classList.toggle('hidden',t!=='gatilhos');
  document.getElementById('viewFila').classList.toggle('hidden',t!=='fila');
  renderFila();   // o badge é recriado a cada renderAbas
}

// o menu lateral aponta pra /automacoes.html#gatilhos e #fila
function abaDoHash(){ const h=(location.hash||'').replace('#',''); if(h==='gatilhos'||h==='fila') setTab(h); }
window.addEventListener('hashchange', abaDoHash);

bootstrap().then(abaDoHash).catch(()=>abaDoHash());
</script>
