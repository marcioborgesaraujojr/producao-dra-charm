<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lojas — Sistema Grupo Aragão</title>
<link rel="icon" type="image/svg+xml" href="/logo_500x500.svg">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/theme.js"></script>
<style>
  html{background:#f1f5f9}html.dark{background:#0b1220}
  body{font-family:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;margin:0}
  .card{background:rgba(255,255,255,.85);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 1px 3px rgba(15,23,42,.08);border:1px solid rgba(226,232,240,.9);border-radius:1rem}
  html.dark .card{background:rgba(17,24,39,.72);box-shadow:0 16px 40px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.35);border-color:rgba(255,255,255,.08)}
  .fld{width:100%;padding:8px 10px;font-size:13px;border-radius:10px;background:#f8fafc;border:1px solid #e2e8f0;outline:none;font-family:ui-monospace,monospace}
  .dark .fld{background:#1f2937;border-color:#374151;color:#e5e7eb}
  [data-fade]{animation:fade .2s ease}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script id="dc-fav-std">(function(){try{document.querySelectorAll('link[rel="icon"],link[rel="shortcut icon"]').forEach(function(l){l.remove();});var l=document.createElement('link');l.rel='icon';l.type='image/png';l.href='https://wwytzoyeibekhstinott.supabase.co/storage/v1/object/public/system-assets/favicon.png';document.head.appendChild(l);}catch(e){}})();</script>
</head>
<body class="text-slate-800 dark:text-slate-100">

<div id="authGate" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-50 dark:bg-ink-900">
  <div class="text-center">
    <div class="w-14 h-14 mx-auto rounded-2xl overflow-hidden mb-4"><img src="/icone-app.png" alt="Aragão" class="w-full h-full object-cover"></div>
    <div class="font-semibold mb-1">Lojas</div><div class="text-sm text-slate-500 mb-4">Faça login na Suíte para acessar.</div>
    <a href="/" class="inline-block text-sm font-semibold text-white bg-pink-500 hover:bg-pink-600 px-4 py-2 rounded-lg">Ir para o login</a>
  </div>
</div>

<div id="appWrap" class="hidden">
<header class="h-14 flex items-center justify-between px-4 bg-white/95 dark:bg-ink-800/95 border-b border-slate-200 dark:border-ink-600 sticky top-0 z-30 backdrop-blur">
  <div class="flex items-center gap-3">
    <button onclick="location.href='/'" title="Voltar à Suíte" class="w-9 h-9 rounded-xl shadow hover:scale-105 hover:shadow-md transition flex items-center justify-center text-white bg-gradient-to-br from-rose-500 to-pink-600"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v4H3zM5 7v13a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V7M9 12h6"/></svg></button>
    <div class="leading-tight"><div class="text-sm font-semibold">Lojas</div><div class="text-[11px] text-slate-500 dark:text-slate-400">Integrações de loja · Grupo Aragão</div></div>
  </div>
  <div class="flex items-center gap-1">
    <button onclick="location.href='/'" class="w-9 h-9 rounded-lg hover:bg-slate-100 dark:hover:bg-ink-700 hover:text-pink-500 flex items-center justify-center text-slate-500" title="Voltar"><img src="/icone-app.png" alt="Suíte" class="w-6 h-6 rounded-md object-cover"></button>
    <button onclick="document.documentElement.classList.toggle('dark')" class="w-9 h-9 rounded-lg hover:bg-slate-100 dark:hover:bg-ink-700 hover:text-pink-500 flex items-center justify-center text-slate-500" title="Tema"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
  </div>
</header>


<div class="p-4 max-w-6xl mx-auto space-y-4">

  <!-- escolha da loja -->
  <div id="chips" class="flex gap-3 flex-wrap"></div>

  <!-- seções da loja escolhida -->
  <div id="abas" class="flex gap-1 flex-wrap border-b border-slate-200 dark:border-ink-600 pb-px"></div>

  <div id="conteudo" class="space-y-4"><div class="text-center text-sm text-slate-400 py-10">carregando…</div></div>
</div>
</div>

<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2.5 rounded-xl text-sm font-semibold text-white bg-slate-800/95 shadow-lg"></div>

<script>
const SUPA = { url:'https://wwytzoyeibekhstinott.supabase.co', key:'sb_publishable_uMoCEK4Ed_u8ZIfjVZ7Jrg_tdR4b9bO' };
let sb=null, TOKEN=null;
async function getSb(){ if(!sb){ const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2'); sb=createClient(SUPA.url,SUPA.key,{auth:{persistSession:true,autoRefreshToken:true}}); } return sb; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x])); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.remove('hidden'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.add('hidden'),2200); }
function relt(d){ if(!d) return '—'; const s=(Date.now()-new Date(d).getTime())/1000; if(s<60)return 'agora'; if(s<3600)return Math.floor(s/60)+'min'; if(s<86400)return Math.floor(s/3600)+'h'; return Math.floor(s/86400)+'d'; }
function dataBr(d){ if(!d) return '—'; return new Date(d).toLocaleDateString('pt-BR'); }

// ---- as lojas ----
const LOJAS = [
  { key:'loja_integrada', nome:'Loja Integrada', sigla:'LI', desc:'Pedidos, pagamento, envio e entrega',
    logo:'/img/loja-integrada.svg', fundo:'bg-white dark:bg-white', api:'/api/li-webhook' },
  { key:'troquecommerce', nome:'TroqueCommerce', sigla:'TC', desc:'Trocas, devoluções, vale e estorno',
    logo:'/img/troquecommerce.png', fundo:'bg-white dark:bg-white', api:'/api/troquecommerce-webhook' }
];
const ABAS = [
  { key:'resumo',    nome:'Visão geral' },
  { key:'gatilhos',  nome:'Gatilhos',        vaiPara:'/automacoes.html#gatilhos' },
  { key:'eventos',   nome:'Eventos' },
  { key:'webhook',   nome:'Webhook' },
  { key:'relatorio', nome:'Relatórios' },
  { key:'fila',      nome:'Fila de envios',  vaiPara:'/automacoes.html#fila' },
  { key:'leads',     nome:'Lista de leads' }
];

let LOJA = (function(){ try{ return localStorage.getItem('autom_loja') || 'loja_integrada'; }catch(e){ return 'loja_integrada'; } })();
if(!LOJAS.some(l=>l.key===LOJA)) LOJA='loja_integrada';
let ABA = (location.hash||'').replace('#','') || 'resumo';
if(!ABAS.some(a=>a.key===ABA)) ABA='resumo';

const lojaAtual = () => LOJAS.find(l=>l.key===LOJA);

// quadradinho com a marca da loja (SVG local, sem depender do site do parceiro)
function marcaLoja(l, tam){
  const p = tam >= 40 ? 'p-1.5' : 'p-1';
  const r = tam >= 40 ? 'rounded-xl' : 'rounded-lg';
  return '<div class="'+r+' '+l.fundo+' border border-slate-200 dark:border-ink-600 '+p
    + ' flex items-center justify-center shrink-0" style="width:'+tam+'px;height:'+tam+'px">'
    + '<img src="'+l.logo+'" alt="'+esc(l.nome)+'" class="w-full h-full object-contain" loading="lazy">'
    + '</div>';
}

function trocarLoja(k){
  LOJA=k; try{ localStorage.setItem('autom_loja',k); }catch(e){}
  renderChips(); renderAbas(); carregarAba();
}
function irPara(a){
  if(a.vaiPara){ try{ localStorage.setItem('autom_loja',LOJA); }catch(e){} location.href=a.vaiPara; return; }
  ABA=a.key; history.replaceState(null,'','#'+a.key); renderAbas(); carregarAba();
}

function renderChips(){
  document.getElementById('chips').innerHTML = LOJAS.map(l=>{
    const on = l.key===LOJA;
    return '<button onclick="trocarLoja(\''+l.key+'\')" class="flex items-center gap-3 px-4 py-3 rounded-2xl border transition text-left '
      + (on ? 'bg-white dark:bg-ink-800 border-pink-300 dark:border-pink-700 ring-2 ring-pink-200 dark:ring-pink-900/50 shadow-sm'
            : 'bg-white/60 dark:bg-ink-800/50 border-slate-200 dark:border-ink-600 hover:border-slate-300') + '">'
      + marcaLoja(l, 40)
      + '<div><div class="text-sm font-semibold '+(on?'':'text-slate-500 dark:text-slate-400')+'">'+esc(l.nome)+'</div>'
      + '<div class="text-[11px] text-slate-400">'+esc(l.desc)+'</div></div></button>';
  }).join('');
}

function renderAbas(){
  document.getElementById('abas').innerHTML = ABAS.map(a=>{
    const on = a.key===ABA && !a.vaiPara;
    return '<button onclick=\'irPara('+JSON.stringify(a)+')\' class="px-3 py-2 text-[13px] font-semibold rounded-t-lg border-b-2 transition '
      + (on ? 'border-pink-500 text-pink-600 dark:text-pink-300'
            : 'border-transparent text-slate-500 hover:text-pink-600 dark:text-slate-400') + '">'
      + esc(a.nome) + '</button>';
  }).join('');
}

async function api(aba, extra){
  const p = new URLSearchParams(Object.assign({ loja:LOJA, aba }, extra||{}));
  const r = await fetch('/api/loja-painel?'+p.toString(), { headers:{ Authorization:'Bearer '+TOKEN } });
  return await r.json();
}

const box = (t) => document.getElementById('conteudo').innerHTML = t;
const carregando = () => box('<div class="text-center text-sm text-slate-400 py-10">carregando…</div>');

function cartao(titulo, corpo, extra){
  return '<div class="card p-4" data-fade><div class="flex items-center justify-between mb-2"><div class="font-semibold text-sm">'+titulo+'</div>'+(extra||'')+'</div>'+corpo+'</div>';
}
function numero(valor, rotulo, cor){
  return '<div class="card p-4 text-center" data-fade><div class="text-2xl font-bold '+(cor||'')+'">'+valor+'</div>'
       + '<div class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">'+rotulo+'</div></div>';
}

// ================= VISÃO GERAL =================
async function abaResumo(){
  carregando();
  const j = await api('resumo');
  if(!j.ok) return box('<div class="card p-4 text-sm text-rose-600">Não deu pra carregar.</div>');
  const ult = (j.ultimos||[]).map(x =>
    '<div class="flex items-center gap-3 p-2 rounded-lg bg-slate-50 dark:bg-ink-800/60">'
    + marcaLoja(lojaAtual(), 32)
    + '<div class="min-w-0 flex-1"><div class="text-[13px] font-semibold truncate">'+esc(x.evento_label||x.evento_codigo||'Evento')+'</div>'
    + '<div class="text-[11px] text-slate-500 truncate">'+esc(x.cliente_nome||'—')+(x.pedido?(' · pedido '+esc(x.pedido)):'')+'</div></div>'
    + '<div class="text-[11px] text-slate-400 shrink-0">'+relt(x.created_at)+'</div></div>').join('');

  box('<div class="grid grid-cols-2 sm:grid-cols-4 gap-3">'
    + numero(j.eventos24h, 'eventos em 24h')
    + numero(j.enviados24h, 'mensagens enviadas', 'text-emerald-600')
    + numero(j.erros24h, 'erros', j.erros24h ? 'text-rose-600' : '')
    + numero(j.gatilhosLigados+'/'+j.gatilhosTotal, 'gatilhos ligados')
    + '</div>'
    + cartao('Últimos eventos recebidos', ult ? '<div class="space-y-2">'+ult+'</div>'
        : '<div class="text-center text-sm text-slate-400 py-6">Nenhum evento ainda.</div>',
        '<button onclick="carregarAba()" class="text-[12px] text-pink-600 font-semibold hover:underline">Atualizar</button>'));
}

// ================= EVENTOS =================
let filtroEvento='';
// O miolo é usado em DOIS lugares: na aba Eventos e no fim da aba Webhook — porque no
// Notificações a página "Webhooks" mostra justamente a lista do que a plataforma mandou.
// Se mexer nas colunas, vale para os dois.
async function blocoEventosHtml(titulo){
  const j = await api('eventos', filtroEvento ? { evento:filtroEvento } : {});
  if(!j.ok) return '<div class="card p-4 text-sm text-rose-600">Não deu pra carregar os eventos.</div>';
  const tipos = Object.entries(j.tipos||{}).sort((a,b)=>b[1]-a[1]);
  const chips = '<div class="flex gap-1.5 flex-wrap mb-3">'
    + '<button onclick="filtrarEvento(\'\')" class="px-2.5 py-1 rounded-full text-[11px] font-semibold '+(!filtroEvento?'bg-pink-100 text-pink-700':'bg-slate-100 text-slate-500 dark:bg-ink-700 dark:text-slate-300')+'">Todos</button>'
    + tipos.map(([c,n])=>'<button onclick="filtrarEvento(\''+c+'\')" class="px-2.5 py-1 rounded-full text-[11px] font-semibold '
        +(filtroEvento===c?'bg-pink-100 text-pink-700':'bg-slate-100 text-slate-500 dark:bg-ink-700 dark:text-slate-300')+'">'
        +esc(j.nomeDoCodigo[c]||c)+' <span class="opacity-60">'+n+'</span></button>').join('')
    + '</div>';

  const linhas = (j.linhas||[]).map(l =>
      '<tr onclick="verEvento('+l.id+')" class="border-t border-slate-100 dark:border-ink-700 cursor-pointer hover:bg-pink-50/60 dark:hover:bg-ink-700/40 transition">'
    + '<td class="py-2 pr-3 text-[12px] text-slate-400 whitespace-nowrap">'+new Date(l.created_at).toLocaleString('pt-BR')+'</td>'
    + '<td class="py-2 pr-3 text-[13px]">'+esc(l.evento_label||l.evento_codigo)+'</td>'
    + '<td class="py-2 pr-3 text-[13px]">'+esc(l.cliente_nome||'—')+'</td>'
    + '<td class="py-2 pr-3 text-[12px] text-slate-500 font-mono">'+esc(l.pedido||'—')+'</td>'
    + '<td class="py-2 pr-3 text-[12px] text-slate-500 font-mono">'+esc(l.cliente_telefone||'—')+'</td>'
    + '<td class="py-2 pr-3 text-[12px] text-slate-500 truncate max-w-[180px]">'+esc(l.cliente_email||'—')+'</td>'
    + '<td class="py-2 pl-2 text-slate-300 text-[13px]">›</td></tr>').join('');

  return cartao(titulo + ' <span class="text-[11px] font-normal text-slate-400">(últimos 200 · clique pra ver o que chegou)</span>',
    chips + (linhas
      ? '<div class="overflow-x-auto"><table class="w-full text-left"><thead><tr class="text-[11px] uppercase tracking-wide text-slate-400">'
        + '<th class="pb-1 pr-3">Quando aconteceu</th><th class="pb-1 pr-3">Evento</th><th class="pb-1 pr-3">Cliente</th><th class="pb-1 pr-3">Pedido</th><th class="pb-1 pr-3">Telefone</th><th class="pb-1 pr-3">E-mail</th><th></th></tr></thead><tbody>'
        + linhas + '</tbody></table></div>'
      : '<div class="text-center text-sm text-slate-400 py-6">Nenhum evento com esse filtro.</div>'),
    '<button onclick="carregarAba()" class="text-[12px] text-pink-600 font-semibold hover:underline">Atualizar</button>');
}

async function abaEventos(){
  carregando();
  box(await blocoEventosHtml('Eventos que a loja mandou'));
}
// ================= UM EVENTO (o que a loja mandou) =================
// Mesma ideia da tela de webhook do Notificações: clicou no evento, vê o que chegou.
function fecharEvento(){
  const m=document.getElementById('modalEvento');
  if(m) m.remove();
  document.removeEventListener('keydown', escFecha);
}
function escFecha(e){ if(e.key==='Escape') fecharEvento(); }

function linhaInfo(rot, val, mono){
  return '<div class="flex gap-2 py-1 border-b border-slate-100 dark:border-ink-700 last:border-0">'
    + '<div class="w-36 shrink-0 text-[11px] text-slate-400 pt-0.5">'+rot+'</div>'
    + '<div class="text-[12px] '+(mono?'font-mono break-all':'')+'">'+val+'</div></div>';
}

function seloDisparo(st){
  const m = { enviado:'bg-emerald-100 text-emerald-700', erro:'bg-rose-100 text-rose-700',
              simulado:'bg-slate-100 text-slate-500', aguardando_modelo:'bg-amber-100 text-amber-700' };
  return '<span class="text-[10px] px-1.5 py-0.5 rounded-full font-semibold '+(m[st]||'bg-slate-100 text-slate-500')+'">'+esc(st||'?')+'</span>';
}

async function verEvento(id){
  fecharEvento();
  document.body.insertAdjacentHTML('beforeend',
    '<div id="modalEvento" class="fixed inset-0 z-[60] flex items-end sm:items-center justify-center p-0 sm:p-6">'
    + '<div onclick="fecharEvento()" class="absolute inset-0 bg-slate-900/40 backdrop-blur-[2px]"></div>'
    + '<div class="relative w-full sm:max-w-3xl max-h-[92vh] sm:max-h-[85vh] overflow-y-auto rounded-t-2xl sm:rounded-2xl bg-white dark:bg-ink-800 shadow-2xl">'
    + '<div id="modalCorpo" class="p-5"><div class="text-center text-sm text-slate-400 py-10">carregando…</div></div>'
    + '</div></div>');
  document.addEventListener('keydown', escFecha);

  let j={};
  try{ j = await api('evento', { id }); }catch(e){ j={}; }
  const alvo = document.getElementById('modalCorpo');
  if(!alvo) return;
  if(!j.ok){
    alvo.innerHTML = '<div class="text-sm text-rose-600">Não deu pra carregar esse evento.</div>'
      + '<button onclick="fecharEvento()" class="mt-3 text-[12px] font-semibold text-pink-600">fechar</button>';
    return;
  }

  const e = j.evento;
  const campos = Object.entries(j.campos||{});
  const disparos = j.disparos||[];

  const cabecalho =
    '<div class="flex items-start gap-3 mb-4">'
    + marcaLoja(lojaAtual(), 40)
    + '<div class="min-w-0 flex-1"><div class="font-semibold text-[15px]">'+esc(e.label||e.codigo)+'</div>'
    + '<div class="text-[11px] text-slate-400">'+esc(e.codigo)+' · '+new Date(e.created_at).toLocaleString('pt-BR')+'</div></div>'
    + '<button onclick="fecharEvento()" class="text-slate-400 hover:text-slate-600 text-xl leading-none px-2">×</button></div>';

  const aviso = j.reconhecido ? ''
    : '<div class="mb-4 rounded-xl bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 p-3 text-[12px] text-amber-800 dark:text-amber-200">'
      + '<b>A suíte não reconheceu esse evento.</b> Ele foi guardado, mas nenhum gatilho combina com ele — '
      + 'por isso nenhuma mensagem saiu. Olhe os campos abaixo pra achar onde a loja mandou o código do evento.</div>';

  const entendeu = '<div class="rounded-xl border border-slate-200 dark:border-ink-600 p-3 mb-4">'
    + '<div class="text-[11px] uppercase tracking-wide text-slate-400 mb-1.5">O que a suíte entendeu</div>'
    + linhaInfo('Cliente', esc(e.cliente_nome||'—'))
    + linhaInfo('Telefone', esc(e.cliente_telefone||'—'), true)
    + linhaInfo('E-mail', esc(e.cliente_email||'—'), true)
    + linhaInfo('Pedido', esc(e.pedido||'—'), true)
    + linhaInfo('Gatilho', j.gatilho ? esc(j.gatilho) : '<span class="text-slate-400">nenhum</span>')
    + '</div>';

  const feito = '<div class="rounded-xl border border-slate-200 dark:border-ink-600 p-3 mb-4">'
    + '<div class="text-[11px] uppercase tracking-wide text-slate-400 mb-1.5">Mensagens desse pedido</div>'
    + (disparos.length
        ? '<div class="space-y-1.5">' + disparos.map(d =>
            '<div class="flex items-center gap-2 text-[12px]">'
            + seloDisparo(d.status)
            + '<span class="font-mono text-[11px] text-slate-500">'+esc(d.evento_key||'')+'</span>'
            + '<span class="text-slate-400 text-[11px] truncate flex-1">'+esc(d.template_name||d.detalhe||'')+'</span>'
            + '<span class="text-slate-400 text-[11px] shrink-0">'+new Date(d.created_at).toLocaleString('pt-BR')+'</span>'
            + '</div>').join('') + '</div>'
        : '<div class="text-[12px] text-slate-400 py-1">Nenhuma mensagem registrada pra esse pedido.</div>')
    + '</div>';

  const tabela = '<div class="rounded-xl border border-slate-200 dark:border-ink-600 p-3 mb-4">'
    + '<div class="text-[11px] uppercase tracking-wide text-slate-400 mb-1.5">Campos que chegaram <span class="normal-case">('+campos.length+')</span></div>'
    + (campos.length
        ? '<div class="max-h-72 overflow-y-auto"><table class="w-full text-left text-[12px]"><tbody>'
          + campos.map(([k,v]) =>
              '<tr class="border-b border-slate-100 dark:border-ink-700 last:border-0">'
              + '<td class="py-1 pr-3 font-mono text-[11px] text-slate-500 align-top whitespace-nowrap">'+esc(k)+'</td>'
              + '<td class="py-1 break-all">'+esc(v)+'</td></tr>').join('')
          + '</tbody></table></div>'
        : '<div class="text-[12px] text-slate-400 py-1">Esse evento foi guardado sem o corpo original.</div>')
    + '</div>';

  const cru = j.payload ? '<div class="rounded-xl border border-slate-200 dark:border-ink-600 p-3">'
    + '<div class="flex items-center justify-between mb-1.5">'
    + '<div class="text-[11px] uppercase tracking-wide text-slate-400">JSON cru</div>'
    + '<button onclick="copiarPayload()" class="text-[11px] font-semibold text-pink-600 hover:underline">copiar</button></div>'
    + '<pre id="payloadCru" class="text-[11px] font-mono whitespace-pre-wrap break-all max-h-72 overflow-y-auto bg-slate-50 dark:bg-ink-900/60 rounded-lg p-2">'
    + esc(JSON.stringify(j.payload, null, 2)) + '</pre></div>' : '';

  alvo.innerHTML = cabecalho + aviso + entendeu + feito + tabela + cru;
}

function copiarPayload(){
  const el=document.getElementById('payloadCru'); if(!el) return;
  navigator.clipboard.writeText(el.textContent).then(()=>toast('JSON copiado'), ()=>toast('não deu pra copiar'));
}

function filtrarEvento(c){ filtroEvento=c; abaEventos(); }

// ================= WEBHOOK =================
async function abaWebhook(){
  carregando();
  const l = lojaAtual();
  let j={}; try{ const r=await fetch(l.api+'?config=1',{headers:{Authorization:'Bearer '+TOKEN}}); j=await r.json(); }catch(e){ j={}; }
  const pronto = !!j.configurado, seco = !!j.modo_seco;
  const selo = (txt,cls)=>'<span class="text-[11px] px-2 py-0.5 rounded-full font-semibold '+cls+'">'+txt+'</span>';

  box(cartao('Endereço que a loja deve chamar',
      '<div class="flex items-center gap-2 mb-2">'
    + (pronto ? selo('endereço pronto','bg-emerald-100 text-emerald-700') : selo('falta o segredo no Vercel','bg-amber-100 text-amber-700'))
    + (seco ? selo('envios pausados','bg-amber-100 text-amber-700') : selo('enviando','bg-emerald-100 text-emerald-700'))
    + (j.wa_ok===false ? selo('WhatsApp não configurado','bg-rose-100 text-rose-700') : '')
    + '</div>'
    + (j.url
      ? '<div class="flex gap-2"><input id="whkUrl" readonly value="'+esc(j.url)+'" class="fld flex-1 min-w-0">'
        + '<button onclick="copiarUrl()" class="text-[12px] font-semibold px-3 rounded-lg bg-pink-500 hover:bg-pink-600 text-white whitespace-nowrap">Copiar</button></div>'
      : '<div class="text-[12px] text-slate-500">Cadastre o segredo do webhook nas variáveis do Vercel pra gerar o endereço.</div>')
    + '<div class="text-[12px] text-slate-500 dark:text-slate-400 mt-3 leading-relaxed">'
    + (LOJA==='loja_integrada'
       ? 'Este endereço já está registrado na Loja Integrada. Ela chama a cada mudança de situação do pedido.'
       : 'Na TroqueCommerce: <b>Automações e Integrações → Webhook</b> → Ativar · cole a URL acima · marque os eventos · Salvar. O painel deles aceita <b>um webhook só</b>.')
    + '</div>'));

  // Igual à página "Webhooks" do Notificações: embaixo do endereço, o que a plataforma
  // realmente mandou. Antes esta aba tinha só a URL e o Marcio não via chegada nenhuma.
  const alvo = document.getElementById('conteudo');
  if(alvo){
    alvo.insertAdjacentHTML('beforeend', '<div id="whkRecebidos" class="text-center text-sm text-slate-400 py-6">carregando o que chegou…</div>');
    try{
      const html = await blocoEventosHtml('Webhooks recebidos da ' + esc(l.nome));
      const cx = document.getElementById('whkRecebidos');
      if(cx) cx.outerHTML = html;
    }catch(e){
      const cx = document.getElementById('whkRecebidos');
      if(cx) cx.outerHTML = '<div class="card p-4 text-sm text-rose-600">Não deu pra carregar o que chegou.</div>';
    }
  }
}
function copiarUrl(){ const el=document.getElementById('whkUrl'); if(!el) return; el.select(); try{ navigator.clipboard.writeText(el.value); }catch(e){ document.execCommand('copy'); } toast('Endereço copiado'); }

// ================= RELATÓRIOS =================
let dias=7;
async function abaRelatorio(){
  carregando();
  const j = await api('relatorio', { dias });
  if(!j.ok) return box('<div class="card p-4 text-sm text-rose-600">Não deu pra carregar.</div>');
  const sel = [7,15,30].map(d=>'<button onclick="mudarDias('+d+')" class="px-2.5 py-1 rounded-lg text-[12px] font-semibold '
      +(dias===d?'bg-pink-100 text-pink-700':'bg-slate-100 text-slate-500 dark:bg-ink-700 dark:text-slate-300')+'">'+d+' dias</button>').join(' ');

  const maxDia = Math.max(1, ...j.porDia.map(d=>d.enviado+d.erro));
  const dia = j.porDia.map(d=>{
    const larg = Math.round(((d.enviado+d.erro)/maxDia)*100);
    return '<div class="flex items-center gap-2 py-1">'
      + '<div class="w-20 text-[12px] text-slate-500 shrink-0">'+d.dia.split('-').reverse().slice(0,2).join('/')+'</div>'
      + '<div class="flex-1 h-4 rounded bg-slate-100 dark:bg-ink-700 overflow-hidden"><div class="h-full bg-emerald-400" style="width:'+larg+'%"></div></div>'
      + '<div class="w-24 text-right text-[12px] tabular-nums"><b>'+d.enviado+'</b>'+(d.erro?' <span class="text-rose-600">'+d.erro+' erro</span>':'')+'</div></div>';
  }).join('');

  const evt = j.porEvento.map(e=>'<tr class="border-t border-slate-100 dark:border-ink-700">'
    + '<td class="py-2 pr-3 text-[13px]">'+esc(e.nome)+'</td>'
    + '<td class="py-2 pr-3 text-[13px] text-emerald-600 font-semibold tabular-nums">'+e.enviado+'</td>'
    + '<td class="py-2 pr-3 text-[13px] '+(e.erro?'text-rose-600 font-semibold':'text-slate-400')+' tabular-nums">'+e.erro+'</td>'
    + '<td class="py-2 text-[13px] text-slate-400 tabular-nums">'+e.outro+'</td></tr>').join('');

  box(cartao('Disparos por dia', dia || '<div class="text-center text-sm text-slate-400 py-6">Nada nesse período.</div>', sel)
    + cartao('Por evento', evt
        ? '<div class="overflow-x-auto"><table class="w-full text-left"><thead><tr class="text-[11px] uppercase tracking-wide text-slate-400">'
          + '<th class="pb-1 pr-3">Evento</th><th class="pb-1 pr-3">Enviados</th><th class="pb-1 pr-3">Erros</th><th class="pb-1">Outros</th></tr></thead><tbody>'
          + evt + '</tbody></table></div>'
        : '<div class="text-center text-sm text-slate-400 py-6">Nada nesse período.</div>'));
}
function mudarDias(d){ dias=d; abaRelatorio(); }

// ================= LEADS =================
let buscaLead='';
async function abaLeads(){
  carregando();
  const j = await api('leads', buscaLead ? { q:buscaLead } : {});
  if(!j.ok) return box('<div class="card p-4 text-sm text-rose-600">Não deu pra carregar.</div>');
  const linhas = (j.leads||[]).map(l=>'<tr class="border-t border-slate-100 dark:border-ink-700">'
    + '<td class="py-2 pr-3 text-[13px] font-medium">'+esc(l.nome||'—')+'</td>'
    + '<td class="py-2 pr-3 text-[12px] font-mono text-slate-500">'+esc(l.telefone)+'</td>'
    + '<td class="py-2 pr-3 text-[12px] text-slate-500 truncate max-w-[200px]">'+esc(l.email||'—')+'</td>'
    + '<td class="py-2 pr-3 text-[12px] text-slate-500">'+esc(l.ultimoEvento||'—')+'</td>'
    + '<td class="py-2 pr-3 text-[12px] text-slate-400 whitespace-nowrap">'+relt(l.visto)+'</td>'
    + '<td class="py-2 text-[12px] text-slate-400 whitespace-nowrap">'+dataBr(l.desde)+'</td></tr>').join('');

  const busca = '<input id="qLead" value="'+esc(buscaLead)+'" placeholder="nome, telefone, e-mail ou pedido…" '
    + 'onkeydown="if(event.key===\'Enter\')buscarLead()" class="fld" style="font-family:inherit;max-width:320px">'
    + ' <button onclick="buscarLead()" class="text-[12px] font-semibold px-3 py-2 rounded-lg bg-slate-100 dark:bg-ink-700 hover:bg-slate-200">Buscar</button>';

  box(cartao('Leads que vieram desta loja <span class="text-[11px] font-normal text-slate-400">('+j.total+' no total)</span>',
    '<div class="flex items-center gap-2 mb-3 flex-wrap">'+busca+'</div>'
    + (linhas
      ? '<div class="overflow-x-auto"><table class="w-full text-left"><thead><tr class="text-[11px] uppercase tracking-wide text-slate-400">'
        + '<th class="pb-1 pr-3">Nome</th><th class="pb-1 pr-3">Telefone</th><th class="pb-1 pr-3">E-mail</th>'
        + '<th class="pb-1 pr-3">Último evento</th><th class="pb-1 pr-3">Visto</th><th class="pb-1">Desde</th></tr></thead><tbody>'
        + linhas + '</tbody></table></div>'
      : '<div class="text-center text-sm text-slate-400 py-6">Ninguém encontrado.</div>'),
    '<button onclick="carregarAba()" class="text-[12px] text-pink-600 font-semibold hover:underline">Atualizar</button>'));
}
function buscarLead(){ const el=document.getElementById('qLead'); buscaLead = el ? el.value.trim() : ''; abaLeads(); }

function carregarAba(){
  if(ABA==='resumo')    return abaResumo();
  if(ABA==='eventos')   return abaEventos();
  if(ABA==='webhook')   return abaWebhook();
  if(ABA==='relatorio') return abaRelatorio();
  if(ABA==='leads')     return abaLeads();
  return abaResumo();
}

window.addEventListener('hashchange', ()=>{
  const h=(location.hash||'').replace('#','');
  if(ABAS.some(a=>a.key===h && !a.vaiPara)){ ABA=h; renderAbas(); carregarAba(); }
});

async function bootstrap(){
  const c=await getSb(); const { data:{ session } }=await c.auth.getSession();
  if(!session){ document.getElementById('authGate').classList.remove('hidden'); return; }
  TOKEN=session.access_token;
  document.getElementById('appWrap').classList.remove('hidden');
  renderChips(); renderAbas(); carregarAba();
}
bootstrap();
