<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relatórios — Sistema Grupo Aragão</title>
<link rel="icon" type="image/svg+xml" href="/logo_500x500.svg">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/theme.js"></script>
<script>

</script>
<style>
  html{background:#f1f5f9}html.dark{background:#0b1220}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;margin:0}
  .kpi{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px}
  .dark .kpi{background:#1e293b;border-color:#334155}
  [data-fade]{animation:fade .2s ease}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .bar{height:8px;border-radius:999px;background:#f1f5f9}.dark .bar{background:#334155}
  .bar > span{display:block;height:100%;border-radius:999px}
</style>

<!-- ===== Tema Dra. Charm: Poppins + cards foscos flutuando (mantém o fundo existente) ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="dc-theme">
  body{font-family:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  /* cards "flutuando": fosco/translúcido + sombra cinza suave (não altera o fundo) */
  .rounded-2xl.border.bg-white{
    background:rgba(255,255,255,.85);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    box-shadow:0 1px 3px rgba(15,23,42,.08);
    border-color:rgba(226,232,240,.9);
  }
  html.dark .rounded-2xl.border.dark\:bg-ink-800{
    background:rgba(17,24,39,.72);
    box-shadow:0 16px 40px rgba(0,0,0,.5), 0 3px 10px rgba(0,0,0,.35);
    border-color:rgba(255,255,255,.08);
  }
  /* leve 3D nos cards clicáveis ao passar o mouse */
  button.rounded-2xl.border.bg-white, a.rounded-2xl.border.bg-white{transition:transform .16s ease, box-shadow .16s ease}
  button.rounded-2xl.border.bg-white:hover, a.rounded-2xl.border.bg-white:hover{box-shadow:0 4px 12px rgba(15,23,42,.10)}
</style>
<script id="dc-fav-std">(function(){try{document.querySelectorAll('link[rel="icon"],link[rel="shortcut icon"]').forEach(function(l){l.remove();});var l=document.createElement('link');l.rel='icon';l.type='image/png';l.href='https://wwytzoyeibekhstinott.supabase.co/storage/v1/object/public/system-assets/favicon.png';document.head.appendChild(l);}catch(e){}})();</script>
</head>
<body class="text-slate-800 dark:text-slate-100">

<div id="authGate" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-50 dark:bg-ink-900">
  <div class="text-center">
    <div class="w-14 h-14 mx-auto rounded-2xl overflow-hidden mb-4"><img src="/icone-app.png" alt="Aragão" class="w-full h-full object-cover"></div>
    <div class="font-semibold mb-1">Relatórios</div><div class="text-sm text-slate-500 mb-4">Faça login na Suíte para acessar.</div>
    <a href="/" class="inline-block text-sm font-semibold text-white bg-pink-500 hover:bg-pink-600 px-4 py-2 rounded-lg">Ir para o login</a>
  </div>
</div>

<div id="appWrap" class="hidden">
<header class="h-14 flex items-center justify-between px-4 bg-white/95 dark:bg-ink-800/95 border-b border-slate-200 dark:border-ink-600 sticky top-0 z-30 backdrop-blur">
  <div class="flex items-center gap-3">
    <button onclick="location.href='/'" title="Voltar à Suíte" class="w-9 h-9 rounded-xl shadow hover:scale-105 hover:shadow-md transition flex items-center justify-center text-white bg-gradient-to-br from-sky-500 to-cyan-600"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="7"/><rect x="12" y="6" width="3" height="11"/><rect x="17" y="13" width="3" height="4"/></svg></button>
    <div class="leading-tight"><div class="text-sm font-semibold">Relatórios</div><div class="text-[11px] text-slate-500 dark:text-slate-400">Atendimento e automações · Grupo Aragão</div></div>
  </div>
  <div class="flex items-center gap-1">
    <button onclick="carregar()" class="text-sm px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-ink-700 hover:bg-slate-200">Atualizar</button>
    <button onclick="location.href='/'" class="w-9 h-9 rounded-lg hover:bg-slate-100 dark:hover:bg-ink-700 hover:text-pink-500 flex items-center justify-center text-slate-500" title="Voltar"><img src="/icone-app.png" alt="Suíte" class="w-6 h-6 rounded-md object-cover"></button>
    <button onclick="document.documentElement.classList.toggle('dark')" class="w-9 h-9 rounded-lg hover:bg-slate-100 dark:hover:bg-ink-700 hover:text-pink-500 flex items-center justify-center text-slate-500" title="Tema"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
  </div>
</header>

<div class="p-4 space-y-6 max-w-5xl mx-auto" id="conteudo">
  <div class="text-sm text-slate-400">Carregando métricas…</div>
</div>
</div>

<script>
const SUPA = { url:'https://wwytzoyeibekhstinott.supabase.co', key:'sb_publishable_uMoCEK4Ed_u8ZIfjVZ7Jrg_tdR4b9bO' };
let sb=null;
async function getSb(){ if(!sb){ const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2'); sb=createClient(SUPA.url,SUPA.key,{auth:{persistSession:true,autoRefreshToken:true}}); } return sb; }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x])); }
async function count(tabela, filtro){ const c=await getSb(); let q=c.from(tabela).select('*',{count:'exact',head:true}); if(filtro) q=filtro(q); const { count:n }=await q; return n||0; }

let TOKEN=null;
async function bootstrap(){
  const c=await getSb(); const { data:{ session } }=await c.auth.getSession();
  if(!session){ document.getElementById('authGate').classList.remove('hidden'); return; }
  TOKEN = session.access_token;
  document.getElementById('appWrap').classList.remove('hidden');
  carregar();
}

// Relatórios da central de atendimento, no formato do Notificações Inteligentes:
// período escolhido, cada número comparado com o período anterior de mesmo tamanho,
// movimento por dia e desempenho por operador. Os números são CONTADOS no servidor
// (/api/atendimento-relatorio) — a versão antiga lia 2000 conversas no navegador e
// chamava aquilo de total.
function hojeStr(){ return new Date().toISOString().slice(0,10); }
function diasAtrasStr(n){ return new Date(Date.now()-n*86400000).toISOString().slice(0,10); }
let R_DE = diasAtrasStr(6), R_ATE = hojeStr();

window.mudarPeriodo = () => {
  R_DE  = document.getElementById('relDe').value  || R_DE;
  R_ATE = document.getElementById('relAte').value || R_ATE;
  carregar();
};
window.periodoRapido = (n) => { R_DE = diasAtrasStr(n-1); R_ATE = hojeStr(); carregar(); };

function variacao(atual, anterior){
  if(!anterior) return '<span class="text-[11px] text-slate-400">sem base de comparação</span>';
  const p = ((atual - anterior) / anterior) * 100;
  const sobe = p >= 0;
  const cor = sobe ? 'text-emerald-600' : 'text-rose-600';
  return '<span class="text-[11px] '+cor+' font-semibold">' + (sobe?'+':'') + p.toFixed(1).replace('.',',') + '%</span>'
       + '<span class="text-[11px] text-slate-400"> vs ' + Number(anterior).toLocaleString('pt-BR') + '</span>';
}
function cartaoNum(rot, valor, comparacao, dica){
  return '<div class="kpi"><div class="text-[12px] text-slate-500 dark:text-slate-400">'+esc(rot)+'</div>'
    + '<div class="text-2xl font-bold mt-1">'+ (valor===null||valor===undefined ? '—' : Number(valor).toLocaleString('pt-BR')) +'</div>'
    + '<div class="mt-1">'+(comparacao||'')+'</div>'
    + (dica ? '<div class="text-[11px] text-slate-400 mt-1">'+esc(dica)+'</div>' : '')
    + '</div>';
}
function duracaoTexto(min){
  if(min===null||min===undefined) return '—';
  if(min < 60) return min + ' min';
  const h = Math.floor(min/60), m = min%60;
  return h + 'h' + String(m).padStart(2,'0');
}

async function carregar(){
  const el = document.getElementById('conteudo');
  el.innerHTML = '<div class="text-center text-sm text-slate-400 py-10">carregando…</div>';
  let j = null;
  try{
    const r = await fetch('/api/atendimento-relatorio?de='+R_DE+'&ate='+R_ATE, { headers:{ Authorization:'Bearer '+TOKEN } });
    j = await r.json();
    if(!r.ok) throw new Error(j.error || ('erro '+r.status));
  }catch(e){
    el.innerHTML = '<div class="kpi text-sm text-rose-600">Não deu pra montar o relatório: '+esc(e.message)+'</div>';
    return;
  }

  const maxDia = Math.max(1, ...j.porDia.map(d => d.recebidas + d.enviadas));
  const linhasDia = j.porDia.map(d => {
    const tot = d.recebidas + d.enviadas;
    const larg = Math.round((tot / maxDia) * 100);
    const pIn = tot ? Math.round((d.recebidas / tot) * 100) : 0;
    return '<div class="flex items-center gap-2 py-1">'
      + '<div class="w-16 text-[12px] text-slate-500 shrink-0">'+d.dia.split('-').reverse().slice(0,2).join('/')+'</div>'
      + '<div class="flex-1 h-4 rounded bg-slate-100 dark:bg-ink-700 overflow-hidden"><div class="h-full flex" style="width:'+larg+'%">'
      +   '<div style="width:'+pIn+'%;background:#0ea5e9"></div><div style="width:'+(100-pIn)+'%;background:#ff3c6f"></div>'
      + '</div></div>'
      + '<div class="w-32 text-right text-[12px] tabular-nums text-slate-500">'
      +   '<b class="text-slate-700 dark:text-slate-200">'+tot+'</b> · '+d.atendimentos+' atend.</div>'
      + '</div>';
  }).join('');

  const ops = (j.operadores||[]).map(o => '<tr class="border-t border-slate-100 dark:border-ink-700">'
    + '<td class="py-2 pr-3 text-[13px]">'+esc(o.operador)+'</td>'
    + '<td class="py-2 pr-3 text-[13px] tabular-nums">'+o.atribuidas+'</td>'
    + '<td class="py-2 pr-3 text-[13px] tabular-nums text-emerald-600 font-semibold">'+o.resolvidas+'</td>'
    + '<td class="py-2 text-[13px] tabular-nums text-amber-600">'+o.ativas+'</td></tr>').join('');

  el.innerHTML =
    '<div class="kpi" data-fade>'
    + '<div class="text-sm font-semibold mb-2">Relatórios da central de atendimento</div>'
    + '<div class="flex flex-wrap items-end gap-2">'
    +   '<div><label class="block text-[11px] text-slate-400 mb-1">De</label><input id="relDe" type="date" value="'+R_DE+'" onchange="mudarPeriodo()" class="fld"></div>'
    +   '<div><label class="block text-[11px] text-slate-400 mb-1">Até</label><input id="relAte" type="date" value="'+R_ATE+'" onchange="mudarPeriodo()" class="fld"></div>'
    +   '<div class="dc-tabs ml-1">'
    +     '<button class="dc-tab" onclick="periodoRapido(7)">7 dias</button>'
    +     '<button class="dc-tab" onclick="periodoRapido(15)">15 dias</button>'
    +     '<button class="dc-tab" onclick="periodoRapido(30)">30 dias</button>'
    +   '</div>'
    + '</div>'
    + '<div class="text-[11px] text-slate-400 mt-2">Comparando com '+j.anterior.de.split('-').reverse().join('/')+' a '+j.anterior.ate.split('-').reverse().join('/')+'.</div>'
    + '</div>'

    + '<div class="grid grid-cols-2 md:grid-cols-4 gap-3" data-fade>'
    +   cartaoNum('Total de mensagens', j.mensagens.total, variacao(j.mensagens.total, j.mensagens.anterior), j.mensagens.recebidas+' recebidas · '+j.mensagens.enviadas+' enviadas')
    +   cartaoNum('Total de atendimentos', j.atendimentos.total, variacao(j.atendimentos.total, j.atendimentos.anterior), j.atendimentos.resolvidas+' resolvidos no período')
    +   cartaoNum('Clientes novos', j.clientes.total, variacao(j.clientes.total, j.clientes.anterior), '')
    +   '<div class="kpi"><div class="text-[12px] text-slate-500 dark:text-slate-400">Tempo médio de atendimento</div>'
    +     '<div class="text-2xl font-bold mt-1">'+duracaoTexto(j.duracaoMediaMin)+'</div>'
    +     '<div class="text-[11px] text-slate-400 mt-1">da abertura até a última mensagem, só nos encerrados</div></div>'
    + '</div>'

    + '<div class="kpi" data-fade><div class="text-sm font-semibold mb-1">Mensagens por dia</div>'
    +   '<div class="text-[11px] text-slate-400 mb-3"><span class="inline-block w-2 h-2 rounded-sm align-middle" style="background:#0ea5e9"></span> recebidas · '
    +   '<span class="inline-block w-2 h-2 rounded-sm align-middle" style="background:#ff3c6f"></span> enviadas</div>'
    +   (linhasDia || '<div class="text-sm text-slate-400 py-4 text-center">Sem movimento no período.</div>')
    + '</div>'

    + '<div class="kpi" data-fade><div class="text-sm font-semibold mb-3">Desempenho por operador</div>'
    +   (ops
      ? '<div class="overflow-x-auto"><table class="w-full text-left"><thead><tr class="text-[11px] uppercase tracking-wide text-slate-400">'
        + '<th class="pb-1 pr-3">Operador</th><th class="pb-1 pr-3">Conversas atribuídas</th><th class="pb-1 pr-3">Resolvidas</th><th class="pb-1">Ativas</th></tr></thead><tbody>'
        + ops + '</tbody></table></div>'
      : '<div class="text-sm text-slate-400 py-4 text-center">Nenhum atendimento no período.</div>')
    + '</div>'

    + '<div class="text-[11px] text-slate-400" data-fade>Atualizado em '+new Date().toLocaleString('pt-BR')+'.'
    +   (j.amostraConversas >= 5000 ? ' Período muito grande: o desempenho por operador considera as 5.000 conversas mais antigas do intervalo.' : '')
    + '</div>';
}

function kpi(label, valor, cor){
  const cores={slate:'text-slate-700 dark:text-slate-200',emerald:'text-emerald-600',amber:'text-amber-600',pink:'text-pink-600',blue:'text-blue-600',teal:'text-teal-600'};
  return `<div class="kpi"><div class="text-[12px] text-slate-500 dark:text-slate-400">${esc(label)}</div><div class="text-2xl font-bold mt-1 ${cores[cor]||''}">${esc(valor)}</div></div>`;
}
function barras(obj, total, cor){
  const entries=Object.entries(obj).sort((a,b)=>b[1]-a[1]);
  if(!entries.length||entries.every(e=>!e[1])) return '<div class="text-sm text-slate-400">Sem dados ainda.</div>';
  return entries.map(([k,v])=>`
    <div class="mb-2">
      <div class="flex justify-between text-[13px] mb-1"><span>${esc(k)}</span><span class="font-semibold">${v}</span></div>
      <div class="bar"><span style="width:${Math.round((v/(total||1))*100)}%;background:${cor}"></span></div>
    </div>`).join('');
}

bootstrap();
</script>
<script src="/nav.js"></script>
</body>
</html>
