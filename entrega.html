<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confirmar Entregas · RASTREIOPEDIDO</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{ --brand:#3E7CB8; --orange:#FB9D3E; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f5f7;color:#222}
  header{background:var(--brand);color:#fff;padding:16px;position:sticky;top:0;z-index:5}
  header .t{font-weight:800;font-size:18px}
  header .s{font-size:13px;opacity:.9}
  .wrap{max-width:640px;margin:0 auto;padding:14px}
  .search{display:flex;gap:8px;margin-bottom:12px}
  .search input{flex:1;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}
  .card{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
  .card .num{font-weight:800;font-size:17px}
  .card .cli{color:#333;margin:2px 0}
  .card .end{color:#777;font-size:14px}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;color:#fff}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .btn{background:var(--orange);color:#fff;border:none;padding:12px 18px;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer;width:100%;margin-top:10px}
  .btn.done{background:#43a047}
  .btn:disabled{opacity:.5}
  .empty{text-align:center;color:#999;padding:40px 10px}
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tab{flex:1;padding:10px;border-radius:10px;border:1px solid #e0e0e0;background:#fff;font-weight:700;color:#666;cursor:pointer;text-align:center}
  .tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  #keybox{max-width:420px;margin:60px auto;background:#fff;padding:24px;border-radius:14px;text-align:center;box-shadow:0 6px 26px rgba(0,0,0,.08)}
  #keybox input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin:12px 0}
</style>

<!-- ===== Tema Dra. Charm: Poppins + cards foscos flutuando (mantém o fundo existente) ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="dc-theme">
  body{font-family:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  /* cards "flutuando": fosco/translúcido + sombra cinza suave (não altera o fundo) */
  .rounded-2xl.border.bg-white{
    background:rgba(255,255,255,.85);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    box-shadow:0 1px 3px rgba(15,23,42,.08);
    border-color:rgba(226,232,240,.9);
  }
  html.dark .rounded-2xl.border.dark\:bg-ink-800{
    background:rgba(17,24,39,.72);
    box-shadow:0 16px 40px rgba(0,0,0,.5), 0 3px 10px rgba(0,0,0,.35);
    border-color:rgba(255,255,255,.08);
  }
  /* leve 3D nos cards clicáveis ao passar o mouse */
  button.rounded-2xl.border.bg-white, a.rounded-2xl.border.bg-white{transition:transform .16s ease, box-shadow .16s ease}
  button.rounded-2xl.border.bg-white:hover, a.rounded-2xl.border.bg-white:hover{box-shadow:0 4px 12px rgba(15,23,42,.10)}
</style>
</head>
<body>
<div id="keybox" style="display:none">
  <h2 style="color:var(--brand);margin-top:0">Confirmar Entregas</h2>
  <p style="color:#777">Cole a chave de acesso do entregador para continuar.</p>
  <input id="keyin" placeholder="chave (mb-...)">
  <button class="btn" onclick="saveKey()">Entrar</button>
</div>

<div id="app" style="display:none">
  <header>
    <div class="t">Confirmar Entregas</div>
    <div class="s">Dra. Charm · toque em <b>Entregue</b> ao concluir</div>
  </header>
  <div class="wrap">
    <div class="tabs">
      <div class="tab active" data-f="motoboy" onclick="setF('motoboy')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;display:inline-block;vertical-align:-0.15em;flex:none"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6h4l2 4M5.5 17.5 9 8h5l2.5 9.5"/></svg> Motoboy</div>
      <div class="tab" data-f="retirada" onclick="setF('retirada')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;display:inline-block;vertical-align:-0.15em;flex:none"><path d="M3 9h18l-1.5-5h-15L3 9Z"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/></svg> Retirada</div>
      <div class="tab" data-f="todos" onclick="setF('todos')">Todos</div>
    </div>
    <div class="search"><input id="q" placeholder="Buscar pedido ou cliente…" oninput="render()"><button class="tab" style="flex:none;padding:10px 14px" onclick="load()">↻</button></div>
    <div id="list"></div>
  </div>
</div>

<script>
const STATUS={faturado:['Faturado','#00897b'],em_separacao:['Em Separação','#7e57c2'],enviado:['Saiu p/ Entrega','#1e88e5'],aguardando_retirada:['Aguard. Retirada','#f9a825'],atrasado:['Atrasado','#e53935'],entregue:['Entregue','#43a047']};
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function bordadoLine(b){
  if(!b||!Array.isArray(b)||!b.length) return '';
  return b.map(x=>{
    const nome=[x.linha1,x.linha2].filter(Boolean).join(' · ');
    const det=[x.cor,x.fonte].filter(Boolean).join(' · ');
    return `<div class="end" style="color:var(--brand)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;display:inline-block;vertical-align:-0.15em;flex:none"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg> ${esc(nome)||'Bordado'}${det?' · '+esc(det):''}</div>`;
  }).join('');
}
let KEY=new URLSearchParams(location.search).get('k')||localStorage.getItem('mb_key')||'';
let ORDERS=[], FILTER='motoboy';

function api(qs,opts){ return fetch('/api/rastreio-sync?'+qs,opts).then(r=>r.json()); }

function boot(){
  if(!KEY){ document.getElementById('keybox').style.display='block'; return; }
  document.getElementById('app').style.display='block';
  load();
}
function saveKey(){ KEY=document.getElementById('keyin').value.trim(); if(!KEY)return; localStorage.setItem('mb_key',KEY); location.href='/entrega.html?k='+encodeURIComponent(KEY); }
function setF(f){ FILTER=f; document.querySelectorAll('.tab[data-f]').forEach(t=>t.classList.toggle('active',t.dataset.f===f)); render(); }

async function load(){
  document.getElementById('list').innerHTML='<div class="empty">Carregando…</div>';
  const r=await api('motoboy=list&k='+encodeURIComponent(KEY));
  if(r.error){ localStorage.removeItem('mb_key'); document.getElementById('app').style.display='none'; document.getElementById('keybox').style.display='block'; return; }
  ORDERS=r.orders||[]; render();
}
function render(){
  const q=(document.getElementById('q')?.value||'').toLowerCase();
  let list=ORDERS.filter(o=>o.status!=='entregue');
  if(FILTER==='retirada') list=list.filter(o=>o.transportadora==='retirada');
  else if(FILTER==='motoboy') list=list.filter(o=>o.transportadora==='motoboy'||o.transportadora==='local');
  if(q) list=list.filter(o=>(o.numero+' '+o.cliente+' '+(o.destino||'')).toLowerCase().includes(q));
  const el=document.getElementById('list');
  if(!list.length){ el.innerHTML='<div class="empty">Nenhuma entrega pendente aqui.</div>'; return; }
  el.innerHTML=list.map(o=>{
    const st=STATUS[o.status]||[o.status,'#9e9e9e'];
    const endereco = o.endereco ? (typeof o.endereco==='string'?o.endereco:[o.endereco.logradouro||o.endereco.endereco,o.endereco.numero,o.endereco.bairro,o.endereco.cidade].filter(Boolean).join(', ')) : (o.destino||'');
    return `<div class="card" id="c${o.id}">
      <div class="row"><span class="num">#${esc(o.numero)}</span><span class="badge" style="background:${st[1]}">${st[0]}</span></div>
      <div class="cli">${esc(o.cliente)||'—'}</div>
      <div class="end"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;display:inline-block;vertical-align:-0.15em;flex:none"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg> ${esc(endereco)||'—'}${o.telefone?' · '+'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;display:inline-block;vertical-align:-0.15em;flex:none"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>'+' '+esc(o.telefone):''}</div>
      ${o.servico?`<div class="end"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;display:inline-block;vertical-align:-0.15em;flex:none"><path d="M10 17h4V5H2v12h3"/><path d="M20 17h2v-3.34a4 4 0 0 0-1.17-2.83L19 9h-5v8h1"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg> ${esc(o.servico)}</div>`:''}
      ${bordadoLine(o.bordado)}
      <button class="btn" onclick="entregar(${o.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;display:inline-block;vertical-align:-0.15em;flex:none"><path d="M20 6 9 17l-5-5"/></svg> Marcar Entregue</button>
    </div>`;
  }).join('');
}
async function entregar(id){
  const btn=document.querySelector('#c'+id+' .btn'); if(!btn)return;
  if(!confirm('Confirmar que o pedido foi ENTREGUE?')) return;
  btn.disabled=true; btn.textContent='Confirmando…';
  const _o=ORDERS.find(x=>x.id===id); const _src=(_o&&_o.transportadora==='retirada')?'retirada':'motoboy';
  const r=await api('motoboy=entregar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({k:KEY,id,source:_src})});
  if(r.ok){ btn.classList.add('done'); btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;display:inline-block;vertical-align:-0.15em;flex:none"><path d="M20 6 9 17l-5-5"/></svg> Entregue!'; setTimeout(()=>{ ORDERS=ORDERS.filter(o=>o.id!==id); render(); },900); }
  else { btn.disabled=false; btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;display:inline-block;vertical-align:-0.15em;flex:none"><path d="M20 6 9 17l-5-5"/></svg> Marcar Entregue'; alert('Erro: '+(r.error||'tente de novo')); }
}
boot();
</script>
</body>
</html>
